plugins { id 'java'; id 'xyz.wagyourtail.unimined' version '1.4.1' }
group = 'mcjty.lostcities'
ext.repositoryRoot = file('../..')
ext.minecraftTarget = '1.12.2'
apply from: '../../build-logic/version.gradle'
base { archivesName = 'lostcities-reanimated' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach { options.release = 8; options.encoding = 'UTF-8' }
unimined.minecraft {
    version '1.12.2'
    mappings { mcp('stable', '39-1.12') }
    runs {
        config('client') { javaVersion = JavaVersion.VERSION_1_8 }
        config('server') { javaVersion = JavaVersion.VERSION_1_8 }
    }
    minecraftForge {
        loader '14.23.5.2859'
        accessTransformer file('development_at.cfg')
    }
}
sourceSets.main.java.srcDir '../../common/src/main/java'
sourceSets.main.resources.srcDir '../../common/src/main/resources'
tasks.withType(AbstractArchiveTask).configureEach { archiveVersion = "${project.version}+mc1.12.2" }
jar.manifest.attributes('FMLAT': 'lostcities_at.cfg')
jar.finalizedBy 'remapJar'

repositories { mavenCentral() }
dependencies { compileOnly 'com.google.code.findbugs:jsr305:3.0.2' }

apply from: '../../build-logic/assets.gradle'
apply from: '../../build-logic/mod-version.gradle'
