plugins { id 'base' }
ext.repositoryRoot = rootDir
apply from: 'build-logic/version.gradle'

def targets = ['1.7.10': 'reobfJar', '1.12.2': 'remapJar']
def releaseDirectory = layout.buildDirectory.dir('release')
def cleanRelease = tasks.register('cleanRelease', Delete) {
    group = 'build'
    description = 'Removes the previous collected release artifacts.'
    delete releaseDirectory
}

// Toolchains are isolated; every target remaps its own production jar.
targets.each { target, productionTask ->
    def suffix = target.replace('.', '_')
    ['build', 'compileJava', 'runClient', 'runServer'].each { action ->
        tasks.register("${action}${suffix}", Exec) {
            group = 'multiversion'
            workingDir rootDir
            commandLine new File(System.getProperty('java.home'), 'bin/java').absolutePath,
                '-classpath', file('gradle/wrapper/gradle-wrapper.jar').absolutePath,
                'org.gradle.wrapper.GradleWrapperMain', '--no-daemon', '-p', "versions/${target}", action
            if (action == 'build') {
                args productionTask
                mustRunAfter cleanRelease
            }
            if (gradle.startParameter.offline) args '--offline'
            // Keep nested wrappers on the same cache, including when -g was used.
            environment 'GRADLE_USER_HOME', gradle.gradleUserHomeDir.absolutePath
            ignoreExitValue = true
            doLast {
                if (executionResult.get().exitValue != 0) {
                    throw new GradleException("Minecraft ${target} ${action} failed; see the target build output above.")
                }
            }
        }
    }
}
tasks.named('build1_12_2') { mustRunAfter 'build1_7_10' }
tasks.register('buildAll') { group = 'build'; dependsOn 'build1_7_10', 'build1_12_2' }
tasks.named('build') { dependsOn 'buildAll' }

tasks.register('release') {
    group = 'build'
    description = 'Builds both production targets and collects their distribution JARs in build/release.'
    dependsOn cleanRelease, 'buildAll'
    doLast {
        // Explicit filenames exclude dev, API, sources and intermediate artifacts.
        def distributions = targets.collect { target, productionTask ->
            def distribution = file("versions/${target}/build/libs/lostcities-reanimated-${project.version}+mc${target}.jar")
            if (!distribution.isFile() || distribution.length() == 0) {
                throw new GradleException("Minecraft ${target} ${productionTask} did not produce its expected distribution JAR: ${distribution}")
            }
            distribution
        }
        // Validate every target before collecting anything, so failures cannot publish a partial set.
        copy {
            from distributions
            into releaseDirectory
        }
        logger.lifecycle("Release ${project.version}: collected ${distributions.size()} distribution JARs in ${releaseDirectory.get().asFile}")
    }
}
